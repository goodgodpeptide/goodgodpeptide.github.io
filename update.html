<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>앱 업데이트 확인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#0f172a;font:16px/1.65 system-ui,sans-serif}main{max-width:480px;margin:12vh auto;padding:24px}h1{font-size:24px;margin:0 0 16px}p{margin:12px 0}.note{color:#475569;font-size:14px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}button,a{font:inherit;padding:10px 16px;border-radius:8px}button{background:#1d4ed8;color:white;border:0;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#1d4ed8}#status{min-height:80px;overflow-wrap:anywhere}
  </style>
</head>
<body>
<main>
  <h1>앱 업데이트 확인</h1>
  <p id="status" role="status" aria-live="polite">최신 앱 파일을 확인합니다.</p>
  <p class="note">기기의 기록과 백업 원본은 그대로 유지합니다. 최신 파일이 확인된 경우에만 앱을 엽니다.</p>
  <div class="actions"><button id="retry" type="button" disabled>확인 중</button><a href="./">기존 앱 열기</a></div>
  <noscript><p>업데이트 확인에는 자바스크립트가 필요합니다. 기존 앱은 위 링크로 열 수 있습니다.</p></noscript>
</main>
<script type="module">
const status=document.getElementById('status'),retry=document.getElementById('retry');
let busy=false,redirected=false;
async function run(){
  if(busy||redirected)return;busy=true;retry.disabled=true;retry.textContent='확인 중';
  try{const {recoverApp}=await import('./app_update.js?check='+Date.now());await recoverApp({onProgress:message=>{status.textContent=message;},redirect:url=>{if(!redirected){redirected=true;location.replace(url);}}});}
  catch{status.textContent='업데이트 확인 파일을 받지 못했습니다. 연결을 확인한 뒤 다시 시도해 주세요. 기기 원본은 유지됩니다.';}
  finally{busy=false;if(!redirected){retry.disabled=false;retry.textContent='다시 확인';}}
}
retry.addEventListener('click',run);run();
</script>
</body>
</html>
